[package]
name = "realtime_translator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
cpal = { version = "0.18", features = ["pipewire", "realtime"] }
rtrb = "0.3"
rubato = "3"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
bytes = "1"

tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures = "0.3.32"
hound = "3.5"
