[package]
name = "realtime_voice_translator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
cpal = { version = "0.18", features = ["pipewire", "realtime"] }
rtrb = "0.3"
rubato = "3"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
bytes = "1"
