[package]
name = "libereco"
version = "0.4.0"
edition = "2024"
authors = ["Andrey Velikoredchanin"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/uncleandy/libereco"
homepage = "https://github.com/uncleandy/libereco"
documentation = "https://github.com/uncleandy/libereco"
readme = "README.md"
keywords = ["translation", "speech", "audio", "ai", "realtime"]
categories = ["multimedia::audio", "api-bindings"]

[dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "io-std"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
cpal = { version = "0.18", features = ["pipewire", "realtime"] }
rtrb = "0.3"
rubato = { version = "3.0", features = ["fft_resampler"] }
anyhow = "1.0"
thiserror = "2.0"
bytes = "1.12"
clap = {  version="4.6", features = ["default", "derive"] }

tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
async-trait = "0.1"
http = "1.4"
dotenvy = "0.15"
symphonia = "0.6.0"
base64-simd = "=0.8.0"
hound = "3.5.1"
audio_samples = { version="2.0.0", features = ["full"] }
i24 = "2.3.4"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
