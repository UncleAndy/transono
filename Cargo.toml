[package]
name = "realtime_translator"
version = "0.3.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "io-std"] }
tokio-util = "0.7"
cpal = { version = "0.18", features = ["pipewire", "realtime"] }
rtrb = "0.3"
rubato = { version = "3.0", features = ["fft_resampler"] }
anyhow = "1.0"
thiserror = "2.0"
bytes = "1.12"

tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
async-trait = "0.1"
http = "1.4"
dotenvy = "0.15"
symphonia = "0.6.0"
base64-simd = "=0.8.0"
hound = "3.5.1"
audio_samples = { version="2.0.0", features = ["full"] }
i24 = "2.3.4"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
